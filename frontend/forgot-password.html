<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password | HotelEase</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">🍴</span> HotelEase</a></div></nav>
<main class="auth-wrap">
  <section class="auth-card">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter the email you used for your HotelEase account and we'll send you a secure reset link.</p>
    <form id="forgot-password-form">
      <div class="form-group">
        <label for="forgot-email">Email address</label>
        <input id="forgot-email" class="form-control" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Send Reset Link</button>
    </form>
    <p id="forgot-message" class="auth-note hidden"></p>
    <p class="auth-switch"><a href="login.html">Back to login</a></p>
  </section>
</main>
<div id="toast" class="toast"></div>
<script src="js/app.js"></script>
<script src="js/password-reset.js"></script>
</body>
</html>
