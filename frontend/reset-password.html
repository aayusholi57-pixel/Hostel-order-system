<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | HotelEase</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">🍴</span> HotelEase</a></div></nav>
<main class="auth-wrap">
  <section class="auth-card">
    <h1>Create a new password</h1>
    <p class="sub">Choose a strong password with at least 8 characters.</p>
    <form id="reset-password-form">
      <div class="form-group">
        <label for="new-password">New password</label>
        <input id="new-password" class="form-control" name="password" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" class="form-control" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Update Password</button>
    </form>
    <p id="reset-message" class="auth-note hidden"></p>
    <p class="auth-switch"><a href="login.html">Return to login</a></p>
  </section>
</main>
<div id="toast" class="toast"></div>
<script src="js/app.js"></script>
<script src="js/password-reset.js"></script>
</body>
</html>
