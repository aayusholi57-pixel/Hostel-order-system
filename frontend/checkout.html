<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | HotelEase</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">🍴</span> HotelEase</a><div class="nav-actions"><a href="cart.html" class="btn btn-secondary btn-sm">← Cart</a></div></div></nav><main class="section" style="padding-top:38px"><div class="container"><div class="section-header"><div><h2>Checkout</h2><p>Enter delivery details and confirm your order.</p></div></div><div class="checkout-layout"><form class="panel" id="checkout-form"><h3>Customer Details</h3><div class="form-row"><div class="form-group"><label>Full Name</label><input class="form-control" name="name" required></div><div class="form-group"><label>Email <span style="font-weight:400;color:#999">(optional for phone accounts)</span></label><input class="form-control" name="email" type="email"></div></div><div class="form-group"><label>Phone</label><input class="form-control" name="phone" required></div><div class="form-group"><label>Delivery / Room Address</label><textarea class="form-control" name="address" rows="4" placeholder="Room number, floor, or delivery location" required></textarea></div><div class="form-group"><label>Payment Method</label><select class="form-control" name="payment" required><option value="Cash on Delivery">Cash on Delivery</option><option value="eSewa">eSewa</option><option value="Khalti">Khalti</option></select></div><button class="btn btn-primary btn-block">Place Order</button></form><div class="panel"><h3>Your Order</h3><div id="checkout-items"></div><div class="summary-row"><span>Subtotal</span><strong id="checkout-subtotal"></strong></div><div class="summary-row"><span>Delivery</span><strong id="checkout-delivery"></strong></div><div class="summary-row total"><span>Total</span><strong id="checkout-total"></strong></div></div></div></div></main><div id="toast" class="toast"></div><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/checkout.js"></script></body></html>
