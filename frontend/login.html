<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | HotelEase</title><link rel="stylesheet" href="css/style.css">
</head>
<body data-auth-mode="login">
<nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">🍴</span> HotelEase</a></div></nav>
<main class="auth-wrap">
  <section class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Use email, Google, or your Nepal phone number.</p>

    <form id="login-form">
      <div class="form-group"><label>Email</label><input class="form-control" name="email" type="email" required></div>
      <div class="form-group"><label>Password</label><input class="form-control" name="password" type="password" required></div>
      <button class="btn btn-primary btn-block" type="submit">Login with Email</button>
    </form>

    <p class="auth-switch"><a href="forgot-password.html">Forgot your password?</a></p>

    <div class="auth-divider"><span>or</span></div>
    <button id="google-login" class="btn google-btn btn-block" type="button">Continue with Google</button>

    <div class="auth-divider"><span>or phone</span></div>
    <div class="form-group"><label>Nepal Mobile Number</label><input id="phone-number" class="form-control" inputmode="numeric" placeholder="98XXXXXXXX"></div>
    <div id="phone-code-wrap" class="form-group hidden"><label>Verification Code</label><input id="phone-code" class="form-control" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"></div>
    <div id="recaptcha-container" style="margin:10px 0"></div>
    <button id="send-phone-btn" class="btn btn-secondary btn-block" type="button">Send OTP</button>
    <button id="verify-phone-btn" class="btn btn-primary btn-block hidden" type="button">Verify & Login</button>

    <p class="auth-switch">New customer? <a href="register.html">Create account</a></p>
    <div class="auth-note">Phone login uses Firebase SMS verification. Your phone number is used for authentication and order delivery contact.</div>
  </section>
</main>
<div id="toast" class="toast"></div>
<script src="js/app.js"></script>
<script type="module" src="js/auth.js"></script>
</body></html>
