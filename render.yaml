services:
  - type: web
    name: hostel-order-system
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://aayusholi57-pixel.github.io
